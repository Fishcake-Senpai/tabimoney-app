<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}Finanças Pessoais{% endblock %} · local</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" aria-label="Finanças Pessoais, painel">
        <span class="brand-mark">F</span>
        <span><strong>Finanças</strong><small>pessoais · local</small></span>
      </a>
      <nav aria-label="Navegação principal">
        <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Painel</a>
        <a href="/importacoes" class="{% if request.url.path.startswith('/importacoes') %}active{% endif %}">Importações</a>
        <a href="/configuracoes" class="{% if request.url.path.startswith('/configuracoes') %}active{% endif %}">Configurações</a>
      </nav>
      <span class="local-pill"><span></span> Esta máquina</span>
    </div>
  </header>
  <main class="page" id="conteudo">
    {% for flash in flash_messages %}
      <div class="notice notice-{{ flash.kind }}" role="status">{{ flash.text }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <span>Dados da carteira ficam no SQLite local.</span>
    <span>Aplicativo acessível somente em 127.0.0.1</span>
  </footer>
</body>
</html>
