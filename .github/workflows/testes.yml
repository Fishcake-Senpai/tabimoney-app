# Testes de cada mudança antes de ela chegar na main. Não gera executável.
# - Push na dev e todo PR para a main ou para a dev.
# - "Testes ok" é o check que a regra da main exige para liberar o merge (ver docs/versionamento.md).
name: Testes

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unidade:
    name: pytest (${{ matrix.nome }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: windows
          - os: macos-latest
            nome: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Testes
        run: python -m pytest

  navegador:
    name: navegador (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Dependências
        run: |
          python -m pip install -r requirements-e2e.txt
          python -m playwright install --with-deps chromium
      - name: Testes de navegador
        run: python -m pytest tests/e2e --screenshot only-on-failure --tracing retain-on-failure --output resultados-e2e
      - name: Capturas e traces das falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-e2e
          path: resultados-e2e
          if-no-files-found: ignore

  ok:
    name: Testes ok
    needs: [unidade, navegador]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Todos passaram?
        run: |
          echo "unidade: ${{ needs.unidade.result }} · navegador: ${{ needs.navegador.result }}"
          test "${{ needs.unidade.result }}" = "success" && test "${{ needs.navegador.result }}" = "success"
