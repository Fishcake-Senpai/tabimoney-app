# Testa e gera o Tabimoney para Windows e Mac em máquinas do GitHub. Se um teste falhar, nada é gerado.
# - Todo merge na main que mexe no app: gera e testa; os zips ficam em Actions › (execução) › Artifacts.
# - Se a versão de app/__init__.py ainda não tem tag vX.Y.Z, o merge também cria a tag e publica o Release com
#   os três zips (é o link para mandar aos amigos). Lançar = subir a versão na dev e fazer o merge na main.
# - Dá para rodar à mão em Actions › Gerar executáveis › Run workflow (na main, também lança se a versão for nova).
name: Gerar executáveis

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "migrations/**"
      - "packaging/**"
      - "docs/agentes/**"
      - "docs/agente-financeiro.md"
      - "requirements*.txt"
      - "tests/**"
      - "pytest.ini"
      - ".github/workflows/executaveis.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: executaveis-${{ github.ref }}
  cancel-in-progress: false  # um lançamento em andamento termina antes do próximo

jobs:
  versao:
    name: Versão nova?
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.v.outputs.versao }}
      nova: ${{ steps.v.outputs.nova }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # traz as tags
      - id: v
        run: |
          VERSAO=$(python3 -c 'import re; print(re.search(r"__version__\s*=\s*\"([^\"]+)\"", open("app/__init__.py").read()).group(1))')
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSAO" > /dev/null; then
            echo "nova=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSAO já foi lançada: gera os executáveis sem publicar Release."
          else
            if [ "$GITHUB_REF" = "refs/heads/main" ] && ! grep -q "^## \[$VERSAO\]" CHANGELOG.md; then
              echo "::error::A versão $VERSAO não tem seção '## [$VERSAO]' no CHANGELOG.md. Veja docs/versionamento.md."
              exit 1
            fi
            echo "nova=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSAO é nova: na main, publica o Release."
          fi

  build:
    name: ${{ matrix.nome }}  # testes + executável
    needs: versao
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: windows
          - os: macos-latest        # Apple Silicon (M1/M2/M3/M4)
            nome: mac-apple-silicon
          - os: macos-15-intel      # Macs com processador Intel
            nome: mac-intel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        # --only-binary: nada de compilar dependência no build; um wheel que sumir quebra aqui, não no executável
        run: python -m pip install --only-binary=cryptography,pydantic-core,cffi -r requirements-dev.txt -r requirements-build.txt

      - name: Testes
        run: python -m pytest

      - name: Versão
        id: v
        run: echo "versao=$(python -c 'from app import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Gerar o executável
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/tabimoney.spec

      - name: Teste rápido (versão, linha de comando, servidor e encerramento)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=dist/Tabimoney.exe; else BIN=dist/Tabimoney.app/Contents/MacOS/Tabimoney; fi
          test "$("$BIN" --versao | tr -d '\r')" = "${{ steps.v.outputs.versao }}"
          "$BIN" cli gastos categorias > /dev/null
          "$BIN" --servidor &
          for i in $(seq 1 90); do curl -sf -o /dev/null http://127.0.0.1:8765/ && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:8765/
          curl -sf http://127.0.0.1:8765/contas | grep -q "<h1>Gastos</h1>"
          python - <<'EOF'
          import json, time
          import httpx
          from app.launch import _port_open, lock_path
          info = json.loads(lock_path().read_text(encoding="utf-8"))
          httpx.post("http://127.0.0.1:8765/_sistema/encerrar", headers={"X-Tabimoney-Token": info["token"]}, timeout=10)
          for _ in range(60):
              if not _port_open():
                  break
              time.sleep(0.5)
          assert not _port_open(), "o servidor não encerrou pelo token"
          print("servidor subiu, respondeu e encerrou pelo token")
          EOF

      - name: Teste rápido do servidor MCP (o agente de IA abre o executável por stdio)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=dist/Tabimoney.exe; else BIN=dist/Tabimoney.app/Contents/MacOS/Tabimoney; fi
          python - "$BIN" <<'EOF'
          import asyncio, json, sys
          from mcp import Client, StdioServerParameters

          async def conversa():
              params = StdioServerParameters(command=sys.argv[1], args=["mcp", "--demo"])
              async with Client(params, mode="legacy", read_timeout_seconds=120) as c:
                  status = json.loads((await c.call_tool("status", {})).content[0].text)
                  assert status["demonstracao"] and len((await c.list_tools()).tools) >= 30
                  assert "Ciclo completo" in (await c.call_tool("roteiro", {"nome": "ciclo"})).content[0].text
                  assert (await c.read_resource("tabimoney://docs/contrato")).contents[0].text
                  assert not (await c.call_tool("carteira_contexto", {})).is_error
              print("servidor MCP respondeu por stdio: ferramentas, roteiro e contrato")

          asyncio.run(conversa())
          EOF

      - name: Teste da atualização com um clique (Windows)
        # Release falso nesta máquina com o próprio executável. Dois cenários: a troca dá certo (clica em "Atualizar
        # agora" e confere) e a versão nova não sobe (confere a reversão). Cada um numa cópia própria do executável.
        if: runner.os == 'Windows'
        run: |
          mkdir -p antigo antigo-reversao release-falso
          cp dist/Tabimoney.exe antigo/
          cp dist/Tabimoney.exe antigo-reversao/
          NOME="Tabimoney-${{ steps.v.outputs.versao }}-windows.zip"
          pwsh -NoProfile -Command "Compress-Archive -Force -Path dist/Tabimoney.exe -DestinationPath release-falso/$NOME"
          python packaging/teste_atualizacao.py antigo/Tabimoney.exe release-falso "$NOME" "${{ steps.v.outputs.versao }}"
          python packaging/teste_atualizacao.py --reverter antigo-reversao/Tabimoney.exe release-falso "$NOME" "${{ steps.v.outputs.versao }}"

      - name: Manual de conexões
        run: python packaging/manual/gerar.py dist/Manual-de-conexoes.html

      - name: Empacotar
        id: pacote
        run: |
          NOME="Tabimoney-${{ steps.v.outputs.versao }}-${{ matrix.nome }}"
          mkdir -p pacote
          cp dist/Manual-de-conexoes.html pacote/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/Tabimoney.exe pacote/
            cp packaging/LEIA-ME.txt pacote/LEIA-ME.txt
            pwsh -NoProfile -Command "Compress-Archive -Force -Path pacote/* -DestinationPath dist/$NOME.zip"
          else
            cp -R dist/Tabimoney.app pacote/
            cp packaging/LEIA-ME-mac.txt pacote/LEIA-ME.txt
            ditto -c -k --sequesterRsrc pacote "dist/$NOME.zip"   # ditto preserva links e permissões do .app
          fi
          echo "nome=$NOME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pacote.outputs.nome }}
          path: dist/${{ steps.pacote.outputs.nome }}.zip
          if-no-files-found: error

  release:
    name: Publicar o Release
    needs: [versao, build]
    if: github.ref == 'refs/heads/main' && needs.versao.outputs.nova == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pacotes
          merge-multiple: true
      - name: SHA256SUMS.txt
        # o app confere o zip baixado por este arquivo antes de atualizar com um clique (app/services/atualizador.py)
        run: cd pacotes && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.versao.outputs.versao }}
          target_commitish: ${{ github.sha }}
          name: Tabimoney ${{ needs.versao.outputs.versao }}
          files: |
            pacotes/*.zip
            pacotes/SHA256SUMS.txt
          body: |
            ## Qual arquivo baixar
            | Seu computador | Arquivo |
            |---|---|
            | Windows | `…-windows.zip` |
            | Mac com chip Apple (M1, M2, M3, M4) | `…-mac-apple-silicon.zip` |
            | Mac com processador Intel | `…-mac-intel.zip` |

            No Mac, veja o chip em  › Sobre este Mac. Cada zip traz o app, o `LEIA-ME.txt` (como abrir pela primeira vez)
            e o `Manual-de-conexoes.html` (como conectar os bancos e as cotações).

            O que mudou nesta versão: [CHANGELOG](https://github.com/${{ github.repository }}/blob/v${{ needs.versao.outputs.versao }}/CHANGELOG.md).
